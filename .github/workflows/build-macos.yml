name: build-macos

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show swift version
        run: swift --version

      - name: Build release
        run: swift build -c release

      - name: Build app bundle + DMG
        run: |
          set -e
          APP_VERSION=$(cat VERSION 2>/dev/null || echo "1.0.0")
          BUILD_VERSION=$(echo "$APP_VERSION" | awk -F. '{printf "%d%02d%02d", $1,$2,$3}')

          mkdir -p dist/ClipTrail.app/Contents/MacOS
          mkdir -p dist/ClipTrail.app/Contents/Resources

          cp .build/release/cliptrail dist/ClipTrail.app/Contents/MacOS/ClipTrail
          chmod +x dist/ClipTrail.app/Contents/MacOS/ClipTrail

          # Add a real app icon (fallback to macOS built-in icon from runner)
          cp /System/Library/CoreServices/CoreTypes.bundle/Contents/Resources/ToolbarCustomizeIcon.icns dist/ClipTrail.app/Contents/Resources/AppIcon.icns || true

          cat > dist/ClipTrail.app/Contents/Info.plist << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>ClipTrail</string>
            <key>CFBundleDisplayName</key><string>ClipTrail</string>
            <key>CFBundleExecutable</key><string>ClipTrail</string>
            <key>CFBundleIdentifier</key><string>com.stanley.cliptrail</string>
            <key>CFBundleVersion</key><string>${BUILD_VERSION}</string>
            <key>CFBundleShortVersionString</key><string>${APP_VERSION}</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>LSUIElement</key><true/>
            <key>LSMultipleInstancesProhibited</key><true/>
          </dict>
          </plist>
          PLIST

          # Ad-hoc sign to reduce Gatekeeper false 'damaged' detections
          codesign --force --deep --sign - dist/ClipTrail.app

          cp scripts/com.stanley.cliptrail.plist dist/com.stanley.cliptrail.plist

          # Prepare DMG staging folder (app + Applications shortcut)
          mkdir -p dist/dmg
          cp -R dist/ClipTrail.app dist/dmg/
          ln -s /Applications dist/dmg/Applications

          # Create DMG
          hdiutil create -volname "ClipTrail" -srcfolder dist/dmg -ov -format UDZO dist/ClipTrail.dmg

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cliptrail-macos
          path: |
            dist/ClipTrail.dmg
            dist/ClipTrail.app
            dist/com.stanley.cliptrail.plist
